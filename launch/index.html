<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f9f9f7; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.5" data-width="1920" data-height="1080">
      <div id="cal" data-composition-id="cal" data-composition-src="compositions/cal.html" data-start="0" data-duration="20" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="position:absolute;inset:0;z-index:1"></div>
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html" data-start="20" data-duration="7.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="position:absolute;inset:0;z-index:2"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="27" data-duration="4.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="position:absolute;inset:0;z-index:3"></div>
      <audio id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-duration="31.5" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
